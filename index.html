<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leads Tracker</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app">
      <h2>Leads Tracker</h2>

      <div class="section">
        <label for="group-name">Create group</label>
        <div class="row">
          <input id="group-name" placeholder="e.g. Clients" />
          <button id="create-group-btn">Add Group</button>
        </div>
      </div>

      <div class="section">
        <label for="group-select">Current group</label>
        <select id="group-select"></select>
      </div>

      <div class="section">
        <label for="key-input">Key</label>
        <input id="key-input" placeholder="Optional. Leave empty to auto-generate" />

        <label for="value-input">Value / URL</label>
        <input id="value-input" placeholder="Paste a URL or custom value" />

        <div class="row">
          <button id="save-input-btn">Save Item</button>
          <button id="save-tab-btn">Save Current Tab</button>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h3 id="group-title">Items</h3>
          <button id="delete-btn" class="secondary">Delete Selected</button>
        </div>
        <ul id="items-list"></ul>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
